<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
  <a href="index.html">Home</a> | <a href="form.html">Register</a>
  <hr>

  <h1>Student Registration Form</h1>

  <form action="thanks.html" method="get">

    <label for="fn">Full Name:</label>
    <input type="text" id="fn" name="fullname" placeholder="Your name" required><br><br>

    <label for="rn">Registration No:</label>
    <input type="text" id="rn" name="regno" required><br><br>

    <label for="em">Email:</label>
    <input type="email" id="em" name="email" required><br><br>

    <label for="ph">Phone:</label>
    <input type="tel" id="ph" name="phone" placeholder="03XXXXXXXXX"><br><br>

    <label for="ag">Age:</label>
    <input type="number" id="ag" name="age" min="16" max="40"><br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob"><br><br>

    Gender:
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female<br><br>

    <label for="dp">Department:</label>
    <select id="dp" name="dept">
      <option>AI</option>
      <option>CS</option>
      <option>SE</option>
      <option>EE</option>
    </select><br><br>

    Interests:
    <input type="checkbox" name="interest" value="Web"> Web
    <input type="checkbox" name="interest" value="AI"> AI
    <input type="checkbox" name="interest" value="Games"> Games<br><br>

    Address:<br>
    <textarea name="address" rows="4" cols="30"></textarea><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

  </form>
</body>
</html>
